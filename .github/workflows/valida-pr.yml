name: Validação do Pull Request

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  validar-pr:
    name: Validar Pull Request
    runs-on: ubuntu-latest
    steps:
      # Em eventos pull_request, actions/checkout faz checkout automaticamente
      # de refs/pull/<n>/merge (resultado simulado do merge com a develop)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolver dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar
        run: |
          python -m compileall -q .

      - name: Executar testes unitários
        run: python -m pytest -v
